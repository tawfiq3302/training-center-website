<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
   
</head>
<body>
    
    <header class="main-page">
        <img src="courses.img/home.page.png" alt="home page"
        class="background-image"
        >
       
        <nav class="pagehome-nav"> 

            <a href="PageHome.html" class="pagehome-link">Home </a>
            <a href="courses.html" class="pagehome-link">Courses </a>
            <a href="schedule.html" class="pagehome-link">Schedule </a>
            <a href="register.html" class="pagehome-link">Register </a>
        </nav>
            
    </header>

    
    <main class="register-page">

        <img src="courses.img/background of home.png" alt="login page" 
        class="register-home-image">

        <div class="form-login">
            
            <form action="#" method="get" class="form-login">
                
                <label for="full-name" class="after">Full Name</label>
                <input type="text" name="full-name" placeholder="please enter full name" 
                required class="inputs1" id="full-name" maxlength="50" > 
                <br><br>
                <label for="email" class="after">Email</label>
                <input type="email" name="email" placeholder="name@gmail.com" required
                class="inputs1" id="email">
                <br><br>
                <label for="phone" class="after">Phone</label>
                <input type="tel" name="phone" placeholder="07XXXXXXXX" required 
                class="inputs1" id="phone" minlength="10" maxlength="10" pattern="07[7-9][0-9]{7}"> 
                <br><br>
                <label for="password" class="after">Password</label>
                <input type="password" name="password" placeholder="enter password" 
                required class="inputs1" id="password" minlength="8" maxlength="30">
                <br><br>
                <label for="age">Age</label>
                <input type="number" name="age" placeholder="enter age" 
                required class="inputs1" id="age" min="18" max="60" >

                <div class="date-field">
                   <label id="date-label" for="date-input">date of birth</label>
                    <input id="date-input" type="date" name="date" required class="inputs1">
                </div>
 
                <br><br>
                <label for="course-id">Choose a course</label>
                <select name="courses" id="course-id">
                    <option value="html">html</option>
                    <option value="css">Css</option>
                    <option value="javascript">javascript</option>
                    <option value="java">java</option>
                </select>
                <br><br>
                <h3>gender :-</h3>
                <input type="radio" name="gender" id="male" value="male">
                <label for="male" class="gender">male</label>
                <input type="radio" name="gender" id="female" value="female">
                <label for="female" class="gender">female</label>
               <br><br>
               <h3>skills :-</h3>
               <input type="checkbox" name="skills" id="communication" value="communication">
               <label for="communication" class="skills">Communication</label>

               <input type="checkbox" name="skills" id="teamwork" value="teamwork">
               <label for="teamwork" class="skills">Teamwork</label>

               <input type="checkbox" name="skills" id="problem-solving" value="problem-solving">
               <label for="problem-solving" class="skills">Problem Solving</label>

               <br class="skill-break"><br class="skill-break">

               <input type="checkbox" name="skills" id="time-management" value="time-management">
               <label for="time-management" class="skills">Time Management</label>

               <input type="checkbox" name="skills" id="leadership" value="leadership">
               <label for="leadership" class="skills">Leadership</label>

               <input type="checkbox" name="skills" id="critical" value="critical">
               <label for="critical" class="skills">Critical</label>

               <br class="skill-break"><br class="skill-break">

               <input type="checkbox" name="skills" id="self-learning" value="self-learning">
               <label for="self-learning" class="skills">Self-Learning</label>

               <input type="checkbox" name="skills" id="creativity" value="creativity">
               <label for="creativity" class="skills">Creativity</label>

               <input type="checkbox" name="skills" id="thinking" value="thinking">
               <label for="thinking" class="skills">Thinking</label>

               <br><br><br>
               <label for="file" class="file-inputs">screen of the courses</label>
               <input type="file" id="file" name="file" class="file-input">
               <br><br><br>
               <textarea name="notes" placeholder="Write your notes here..."></textarea>
               <br><br>
               <button type="submit">submit</button>
               <button type="reset">reset</button>
               <button type="button">Contact Us</button>
            </form>
            
            <footer>

                <p>
                    <a href="mailto:trainingcenter@gmail.com" >Email us</a>
                    <a href="tel:+962779133256">Call us</a>
                </p>

            
            </footer>


            
        </div>
        <iframe class="map" src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d734.9194888793243!2d35.736616153194724!3d32.039483550355534!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sar!2sjo!4v1789735380201!5m2!1sar!2sjo"
               width="600" height="450" style="border:0;" allowfullscreen=""
                loading="lazy"
                 referrerpolicy="strict-origin-when-cross-origin"></iframe>
            
        
    </main>

</body>
</html>
